<!doctype html>
<html lang="uz" data-section="instagram">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Instagram va YouTube videolarini asl sifat va formatda Telegram chatingizga yuklab beruvchi Mini App.">
  <title>MediaBot</title>
  <link rel="stylesheet" href="app.css">
  <!-- Telegram SDK: if it fails to load, app.js still works (browser / mock mode). -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js" defer></script>
</head>
<body>

      <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.5"/>

      <circle cx="17.4" cy="6.6" r=".6" fill="currentColor"/>

    <symbol id="i-youtube" viewBox="0 0 24 24">
      <path fill="#FF0033" d="M22.5 7.2a3 3 0 0 0-2.1-2.1C18.5 4.6 12 4.6 12 4.6s-6.5 0-8.4.5A3 3 0 0 0 1.5 7.2 31 31 0 0 0 1 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.4.5 8.4.5s6.5 0 8.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23 12a31 31 0 0 0-.5-4.8Z"/>
      <path fill="#fff" d="m9.8 15.1 5.6-3.1-5.6-3.1z"/>
    </symbol>
    <symbol id="i-youtube-mono" viewBox="0 0 24 24">
      <path fill="currentColor" d="M22.5 7.2a3 3 0 0 0-2.1-2.1C18.5 4.6 12 4.6 12 4.6s-6.5 0-8.4.5A3 3 0 0 0 1.5 7.2 31 31 0 0 0 1 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.4.5 8.4.5s6.5 0 8.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23 12a31 31 0 0 0-.5-4.8Zm-12.7 7.9V8.9l5.6 3.1z"/>

      <path d="M12 3.5v11"/><path d="m7 10 5 5 5-5"/><path d="M4.5 16.5v1.75A2.25 2.25 0 0 0 6.75 20.5h10.5a2.25 2.25 0 0 0 2.25-2.25V16.5"/>

      <rect x="8" y="2.5" width="8" height="4" rx="1.2"/><path d="M16 4.5h1.75A2.25 2.25 0 0 1 20 6.75v12A2.25 2.25 0 0 1 17.75 21H6.25A2.25 2.25 0 0 1 4 18.75v-12A2.25 2.25 0 0 1 6.25 4.5H8"/><path d="M9 12.5h6"/><path d="M9 16h4"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13.5a4.5 4.5 0 0 0 6.6.4l2.8-2.8a4.5 4.5 0 0 0-6.4-6.4l-1.5 1.5"/><path d="M14 10.5a4.5 4.5 0 0 0-6.6-.4l-2.8 2.8a4.5 4.5 0 0 0 6.4 6.4l1.5-1.5"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5 6.5 6.5 17.5"/><path d="m6.5 6.5 11 11"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 4.5 4.5L19 7.5"/>
    </symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.25"/><path d="m8 12.3 2.8 2.8L16.2 9.6"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.25"/><path d="M12 7.5v5.25"/><path d="M12 16.4v.1"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.25"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/>
    </symbol>
    <symbol id="i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m16 3.5 4 4-4 4"/><path d="M20 7.5H8"/><path d="m8 20.5-4-4 4-4"/><path d="M4 16.5h12"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1L20.5 8.5"/><path d="M20.5 3.5v5h-5"/>
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5.5l11-2v12.5"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>
    </symbol>
    <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M16 4.5A2 2 0 0 0 14 3H5a2 2 0 0 0-2 2v9a2 2 0 0 0 1.5 1.95"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.25"/><path d="M12 7v5l3.2 2"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="2.5" width="11" height="19" rx="2.75"/><path d="M11 18.25h2"/>
    </symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="4" width="19" height="12.5" rx="2.5"/><path d="M8.5 20.5h7"/><path d="M12 16.5v4"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 3 10.5 13.5"/><path d="m21 3-6.5 18-4-7.5-7.5-4z"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.75"/><path d="m21 15.5-4.3-4.3a1.5 1.5 0 0 0-2.1 0L5.5 20.5"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path fill="currentColor" d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6Z"/>
    </symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2.5 4.5 13.5h7l-1 8 8.5-11h-7z"/>
    </symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2.5H7A2.5 2.5 0 0 0 4.5 5v14A2.5 2.5 0 0 0 7 21.5h10a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 2.5V8h5.5"/>
    </symbol>
    <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/><path d="M12 7.5V12l3 1.75"/>
    </symbol>
    <symbol id="i-arrow-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 17 17 7"/><path d="M8 7h9v9"/>
    </symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5c.6 3.9 2.6 5.9 6.5 6.5-3.9.6-5.9 2.6-6.5 6.5-.6-3.9-2.6-5.9-6.5-6.5 3.9-.6 5.9-2.6 6.5-6.5Z"/><path d="M19 16.5c.25 1.4 1 2.15 2.4 2.4-1.4.25-2.15 1-2.4 2.4-.25-1.4-1-2.15-2.4-2.4 1.4-.25 2.15-1 2.4-2.4Z"/>
    </symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 3 18 18"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2.4-1.7"/><path d="M2 9.4a15 15 0 0 1 4.2-2.6"/><path d="M22 9.4A15 15 0 0 0 11 5.6"/><path d="M12 20h.01"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9.5 6 6 6-6 6"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20.5V11"/><path d="M10 20.5V4"/><path d="M16 20.5v-6.5"/><path d="M21 20.5H3"/>
    </symbol>
  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="ic"><use href="#i-download"/></svg></span>
        <div class="brand-text">
          <p class="brand-name">MediaBot <span class="demo-pill" id="demoPill" hidden>DEMO</span></p>
          <p class="brand-sub">Asl sifat · asl format</p>
        </div>
      </div>
      <button type="button" class="avatar-btn" id="profileBtn" aria-haspopup="dialog" aria-controls="sheet" aria-label="Profil va statistika">
        <span class="avatar" id="avatar" aria-hidden="true"><svg class="ic"><use href="#i-chart"/></svg></span>
      </button>
    </header>

    <div class="banners" id="banners"></div>

    <div class="platform-tabs" role="tablist" aria-label="Platforma">
      <button type="button" role="tab" class="ptab" id="tab-instagram" data-platform="instagram" aria-controls="panel" aria-selected="true">
        <svg class="ic ic-brand" aria-hidden="true"><use href="#i-instagram"/></svg><svg class="ic ic-mono" aria-hidden="true"><use href="#i-instagram-mono"/></svg><span>Instagram</span>
      </button>
      <button type="button" role="tab" class="ptab" id="tab-youtube" data-platform="youtube" aria-controls="panel" aria-selected="false" tabindex="-1">
        <svg class="ic ic-brand" aria-hidden="true"><use href="#i-youtube"/></svg><svg class="ic ic-mono" aria-hidden="true"><use href="#i-youtube-mono"/></svg><span>YouTube</span>
      </button>
      <span class="ptab-thumb" aria-hidden="true"></span>
    </div>

    <main class="panel" id="panel" role="tabpanel" aria-labelledby="tab-instagram">
      <div class="subtabs" id="subtabs" role="tablist" aria-label="YouTube bo‘limi" hidden>
        <button type="button" role="tab" class="stab" id="tab-shorts" data-section="shorts" aria-selected="true">
          <svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg><span>Shorts</span>
        </button>
        <button type="button" role="tab" class="stab" id="tab-videos" data-section="videos" aria-selected="false" tabindex="-1">
          <svg class="ic" aria-hidden="true"><use href="#i-monitor"/></svg><span>Videolar</span>
        </button>
        <span class="stab-thumb" aria-hidden="true"></span>
      </div>

      <form class="card input-card" id="linkForm" novalidate autocomplete="off">
        <div class="input-head">
          <h1 class="sec-title" id="secTitle">Instagram Reels va postlar</h1>
          <p class="sec-sub" id="secSub">Reels, post va karusellar</p>
        </div>
        <label class="sr-only" for="url" id="urlLabel">Havola</label>
        <div class="field" id="field">
          <svg class="ic field-ic" aria-hidden="true"><use href="#i-link"/></svg>
          <input class="field-input" id="url" name="url" type="text" inputmode="url" enterkeyhint="go"
                 autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                 aria-describedby="hint" placeholder="instagram.com/reel/…">
          <button type="button" class="field-clear" id="clearBtn" aria-label="Maydonni tozalash" hidden>
            <svg class="ic" aria-hidden="true"><use href="#i-x"/></svg>
          </button>
        </div>
        <p class="hint" id="hint"></p>
        <div class="actions">
          <button type="button" class="btn btn-secondary" id="pasteBtn">
            <svg class="ic" aria-hidden="true"><use href="#i-paste"/></svg><span>Joylash</span>
          </button>
          <button type="submit" class="btn btn-primary" id="checkBtn">
            <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>Tekshirish</span>
          </button>
        </div>
      </form>

      <div id="notice"></div>
      <section class="workspace" id="workspace" aria-label="Natija"></section>

      <section class="history" aria-labelledby="historyTitle">
        <div class="section-head">
          <div>
            <h2 class="section-title" id="historyTitle">Tarix</h2>
            <p class="section-sub" id="historySub">So‘nggi yuklamalaringiz</p>
          </div>
          <button type="button" class="icon-btn" id="refreshBtn" aria-label="Tarixni yangilash">
            <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>
          </button>
        </div>
        <div id="historyList" aria-busy="false"></div>
      </section>

      <p class="foot">Fayllar bot orqali shaxsiy chatingizga yuboriladi.</p>
    </main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="sheetTitle">Profil</h2>
        <button type="button" class="icon-btn" id="sheetClose" aria-label="Yopish">
          <svg class="ic" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast-wrap" aria-live="polite" aria-atomic="true"><div class="toast" id="toast" hidden></div></div>
  <div class="sr-only" id="srLive" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
